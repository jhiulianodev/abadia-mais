<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App — Paciente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#005A8E}a:hover{color:#00476F}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #FFC83D;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F8FA; color: #0B2540; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #FFFFFF; border-bottom: 1px solid #DDE6EE; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 12px; flex: none">
<div style="display: flex; align-items: center; gap: 12px"><a href="AppRemedioReceita.dc.html" aria-label="Voltar" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #D3E2EC; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B2540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a><h1 style="margin: 0; font-family: Poppins; font-size: 22px; font-weight: 700; color: #0B2540">Pedir remédio</h1></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 16px; font-weight: 700; color: #4A5B6C">Passo 2 de 4 · Paciente</span><div style="height: 8px; border-radius: 4px; background: #D3E2EC"><div style="height: 8px; border-radius: 4px; background: #005A8E; width: 50%"></div></div></div></div>
<div style="flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Poppins; font-size: 22px; line-height: 1.25; color: #0B2540">Para quem é o remédio?</h2>
<button type="button" onClick="{{ pickMe }}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: {{ meBg }}; border: {{ meBorder }}; color: #0B2540; text-align: left"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#005A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 20px">Para mim</span><span style="font-size: 16px; color: #4A5B6C">Usar meus dados do gov.br</span></span></button>
<button type="button" onClick="{{ pickOther }}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: {{ otherBg }}; border: {{ otherBorder }}; color: #0B2540; text-align: left"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#005A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM6 21v-2a6 6 0 0 1 12 0v2"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 20px">Para outra pessoa</span><span style="font-size: 16px; color: #4A5B6C">Familiar, vizinho, pessoa que você cuida</span></span></button>
<sc-if value="{{ isMe }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #E3F5EA; color: #17663A; font-size: 17px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B7A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>Preenchido pelo gov.br</div>
<div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #D3E2EC; display: flex; flex-direction: column; gap: 10px; "><div><span style="display: block; font-size: 16px; color: #4A5B6C">Nome completo</span><b style="font-size: 19px">Jhiuliano Quinta de Lucia</b></div><div><span style="display: block; font-size: 16px; color: #4A5B6C">CPF</span><b style="font-size: 19px">000.000.000-00</b></div><div><span style="display: block; font-size: 16px; color: #4A5B6C">Cartão do SUS</span><b style="font-size: 19px">000 0000 0000 0000</b></div></div>
<a href="#" style="font-size: 17px; font-weight: 700">Corrigir dados</a>
</sc-if>
<sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px; ">Nome completo do paciente<input value="Maria Aparecida de Lucia" style="min-height: 56px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #8FB3CC; font-size: 19px; color: #0B2540; background: #FFFFFF"></label>
<div style="display: flex; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0">CPF<input value="000.000.000-00" style="min-height: 56px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #8FB3CC; font-size: 19px; color: #0B2540; background: #FFFFFF"></label><label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0">Nascimento<input value="00/00/0000" style="min-height: 56px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #8FB3CC; font-size: 19px; color: #0B2540; background: #FFFFFF"></label></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px; ">Cartão do SUS<input value="000 0000 0000 0000" style="min-height: 56px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #8FB3CC; font-size: 19px; color: #0B2540; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px; ">Parentesco<input value="Mãe" style="min-height: 56px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #8FB3CC; font-size: 19px; color: #0B2540; background: #FFFFFF"></label>
</sc-if>
<a href="AppRemedioEntrega.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 18px; background: #005A8E; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none; box-sizing: border-box">Continuar</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { me: true }; }
  renderVals() {
    const me = this.state.me, on = '3px solid #005A8E', off = '2px solid #D3E2EC';
    return { isMe: me, isOther: !me, meBorder: me ? on : off, meBg: me ? '#EEF5FA' : '#FFFFFF', otherBorder: !me ? on : off, otherBg: !me ? '#EEF5FA' : '#FFFFFF',
      pickMe: () => this.setState({ me: true }), pickOther: () => this.setState({ me: false }) };
  }
}
</script>
</body>
</html>
