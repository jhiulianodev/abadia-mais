<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App — Situação do pedido de remédio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#005A8E}a:hover{color:#00476F}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #FFC83D;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F8FA; color: #0B2540; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #FFFFFF; border-bottom: 1px solid #DDE6EE; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 12px; flex: none">
<div style="display: flex; align-items: center; gap: 12px"><a href="AppMeusPedidos.dc.html" aria-label="Voltar" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #D3E2EC; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B2540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a><h1 style="margin: 0; font-family: Poppins; font-size: 22px; font-weight: 700; color: #0B2540">Meu pedido</h1></div></div>
<div style="flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: Poppins; font-size: 24px">Pedido nº 4821</h2><span style="font-size: 16px; color: #4A5B6C">25/11 · 10:42</span></div>
<div role="group" aria-label="Ver exemplo" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: #E4ECF2">
<button type="button" onClick="{{ modeRet }}" style="min-height: 46px; border-radius: 12px; border: 0; background: {{ retTab }}; color: #0B2540; font-size: 17px; font-weight: 700">Retirada</button>
<button type="button" onClick="{{ modeCol }}" style="min-height: 46px; border-radius: 12px; border: 0; background: {{ colTab }}; color: #0B2540; font-size: 17px; font-weight: 700">Entrega em casa</button></div>
<div style="padding: 18px; border-radius: 22px; background: {{ curBg }}; color: {{ curFg }}; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 1px">SITUAÇÃO AGORA</span>
<span style="font-family: Poppins; font-weight: 700; font-size: 24px; line-height: 1.2">{{ curTitle }}</span>
<span style="font-size: 18px; line-height: 1.4">{{ curText }}</span></div>
<ol style="list-style: none; margin: 0; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #D3E2EC">
<sc-for list="{{ track }}" as="tr" hint-placeholder-count="6">
<li style="display: flex; gap: 14px"><div style="display: flex; flex-direction: column; align-items: center"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{ tr.dot }}; border: 3px solid {{ tr.ring }}; box-sizing: border-box; flex: none"></span><span style="width: 3px; flex: 1; min-height: 18px; background: #DDE6EE"></span></div>
<div style="padding-bottom: 12px"><p style="margin: 0; font-weight: 700; font-size: 18px; color: {{ tr.color }}">{{ tr.label }}</p><p style="margin: 2px 0 0; font-size: 15px; color: #4A5B6C">{{ tr.when }}</p></div></li>
</sc-for></ol>
<sc-if value="{{ showCode }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 20px; background: #005A8E; color: #FFFFFF"><span style="width: 84px; height: 84px; border-radius: 14px; background: #FFFFFF; color: #0B2540; font-family: Poppins; font-weight: 700; font-size: 24px; display: flex; align-items: center; justify-content: center; flex: none">4821</span><span style="font-size: 17px; line-height: 1.4">{{ codeText }}</span></div>
</sc-if>
<button type="button" onClick="{{ advance }}" style="min-height: 52px; border-radius: 14px; border: 2px dashed #8FB3CC; background: #FFFFFF; color: #0B2540; font-size: 17px; font-weight: 700">Simular próxima etapa (apresentação)</button>
<a href="AppAjuda.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 18px; background: #FFFFFF; color: #0B2540; border: 2px solid #D3E2EC; font-size: 20px; font-weight: 700; text-decoration: none; box-sizing: border-box">Falar com a farmácia</a>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ret: false, stage: 1 }; }
  renderVals() {
    const S = this.state, r = S.ret;
    const steps = r
      ? [['Receita enviada', '25/11 às 10:42'], ['Verificando receita', 'Farmácia Municipal conferindo'], ['Receita aprovada · separando', 'Farmácia separando os remédios'], ['Aguardando retirada', 'Pode buscar na Farmácia Municipal'], ['Retirado', 'Retirado por Jhiuliano']]
      : [['Receita enviada', '25/11 às 10:42'], ['Verificando receita', 'Farmácia Municipal conferindo'], ['Receita aprovada · separando', 'Farmácia separando os remédios'], ['Aguardando coleta', 'Motorista da Saúde vai buscar na farmácia'], ['Saiu para entrega', 'A caminho do seu endereço'], ['Entregue', 'Recebido por Jhiuliano']];
    const st = Math.min(S.stage, steps.length - 1);
    const info = r
      ? [['Receita enviada', 'Recebemos sua receita.', '#EEF5FA', '#0B2540'], ['Verificando receita', 'A Farmácia Municipal está conferindo sua receita. Isso leva até 1 dia útil.', '#FFF6DC', '#3D2B00'], ['Separando seus remédios', 'Receita aprovada! A farmácia está separando.', '#EEF5FA', '#0B2540'], ['Aguardando retirada', 'Pronto! Busque na Farmácia Municipal até 05/12, de seg a sex, 7h às 17h.', '#005A8E', '#FFFFFF'], ['Retirado', 'Remédio entregue em mãos. Obrigado!', '#E3F5EA', '#17663A']]
      : [['Receita enviada', 'Recebemos sua receita.', '#EEF5FA', '#0B2540'], ['Verificando receita', 'A Farmácia Municipal está conferindo sua receita. Isso leva até 1 dia útil.', '#FFF6DC', '#3D2B00'], ['Separando seus remédios', 'Receita aprovada! A farmácia está separando.', '#EEF5FA', '#0B2540'], ['Aguardando coleta', 'O motorista da Saúde vai buscar seu remédio na farmácia.', '#005A8E', '#FFFFFF'], ['Saiu para entrega', 'O motorista está a caminho. Deixe alguém em casa para receber.', '#005A8E', '#FFFFFF'], ['Entregue', 'Remédio entregue no seu endereço. Obrigado!', '#E3F5EA', '#17663A']];
    const cur = info[st];
    return {
      retTab: r ? '#FFFFFF' : 'transparent', colTab: !r ? '#FFFFFF' : 'transparent',
      modeRet: () => this.setState({ ret: true, stage: 1 }), modeCol: () => this.setState({ ret: false, stage: 1 }),
      curTitle: cur[0], curText: cur[1], curBg: cur[2], curFg: cur[3],
      track: steps.map((s, i) => { const d = i <= st; return { label: s[0], when: d ? s[1] : 'Aguardando', dot: i < st ? '#1B7A43' : d ? '#005A8E' : '#FFFFFF', ring: i < st ? '#1B7A43' : d ? '#005A8E' : '#C5D3DD', color: d ? '#0B2540' : '#4A5B6C' }; }),
      showCode: st >= 3 && st < steps.length - 1,
      codeText: r ? 'Mostre este número e um documento com foto na farmácia.' : 'Diga este número ao motorista para receber.',
      advance: () => this.setState({ stage: st + 1 >= steps.length ? 0 : st + 1 })
    };
  }
}
</script>
</body>
</html>
